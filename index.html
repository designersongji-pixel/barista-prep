<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f1e7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="바리스타">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>바리스타 잡 준비</title>
<style>
:root{
  --bg:#f7f1e7; --card:#fffdf9; --ink:#2a221d; --sub:#7a6c61; --line:#e8dfd2;
  --accent:#8a5a3b; --accent-2:#c9a27e; --soft:#f1e6d8;
  --ok:#2f8a57; --ok-bg:#e3f3e9; --ng:#c4483e; --ng-bg:#fbe7e4; --ex:#c27a12; --ex-bg:#fdf0da;
  --r:14px; --shadow:0 1px 2px rgba(60,40,20,.06),0 4px 14px rgba(60,40,20,.06);
  --hand:"Marker Felt","Chalkboard SE","Comic Sans MS","Segoe Print",cursive;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Segoe UI",sans-serif;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:rgba(247,241,231,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hbar{display:flex;align-items:center;gap:8px;padding:10px 16px 4px;max-width:880px;margin:0 auto}
.hbar h1{font-size:17px;margin:0;flex:1;letter-spacing:-.2px}
.hbar h1 span{color:var(--accent)}
nav{display:flex;gap:4px;overflow-x:auto;padding:4px 12px 10px;max-width:880px;margin:0 auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;text-decoration:none;color:var(--sub);padding:7px 12px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap}
nav a.on{background:var(--ink);color:#fff}
main{max-width:880px;margin:0 auto;padding:16px 14px 90px}
h2{font-size:21px;margin:6px 2px 4px;letter-spacing:-.3px}
h3{font-size:16px;margin:18px 2px 8px}
.lead{color:var(--sub);font-size:14px;margin:0 2px 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.btn{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:9px 14px;font-weight:600;cursor:pointer;font-size:15px;line-height:1.2;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--sub)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--sub);white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--sub);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.muted{color:var(--sub)}
.small{font-size:13px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--soft);color:var(--accent)}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.ng{background:var(--ng-bg);color:var(--ng)}
.play{width:38px;height:38px;flex:none;border-radius:50%;border:0;background:var(--soft);color:var(--accent);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.play svg{width:16px;height:16px}
.play.big{width:72px;height:72px;background:var(--accent);color:#fff}
.play.big svg{width:28px;height:28px}
.play.speaking{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(138,90,59,.15)}}
textarea,input[type=text],input[type=number],input[type=search]{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 13px;font-size:17px;outline:none;resize:none}
textarea:focus,input:focus{border-color:var(--accent-2)}
/* list */
.li{display:flex;gap:10px;align-items:flex-start;padding:10px 2px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .en{font-weight:600}
.li .ko{color:var(--sub);font-size:14px}
.li .tip{font-size:12.5px;color:var(--accent);margin-top:2px}
.qa-q{font-weight:700;margin-bottom:4px}
.qa-a{padding-left:10px;border-left:3px solid var(--soft);margin:6px 0}
/* drill */
.drill-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.bar{height:5px;background:var(--soft);border-radius:9px;flex:1;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .3s}
.prompt{text-align:center;padding:10px 4px 14px}
.prompt .ko-big{font-size:19px;font-weight:700;line-height:1.45}
.prompt .ctx{font-size:13.5px;color:var(--sub);margin-bottom:8px}
.diff{font-size:17px;line-height:1.9;margin:4px 0 8px}
.w{padding:1px 3px;border-radius:5px;margin-right:2px}
.w.ok{background:var(--ok-bg);color:var(--ok)}
.w.miss{background:var(--ng-bg);color:var(--ng);text-decoration:line-through;text-decoration-thickness:1.5px}
.w.extra{background:var(--ex-bg);color:var(--ex)}
.result{border-top:1px dashed var(--line);margin-top:12px;padding-top:12px}
.score{font-size:28px;font-weight:800}
.score.ok{color:var(--ok)} .score.mid{color:var(--ex)} .score.ng{color:var(--ng)}
.legend{font-size:12px;color:var(--sub)}
.kbd{font-size:12px;color:var(--sub);text-align:center;margin-top:8px}
/* dialogue */
.bubbles{display:flex;flex-direction:column;gap:8px}
.bub{max-width:86%;padding:9px 13px;border-radius:16px;font-size:15.5px;position:relative}
.bub .k{display:block;font-size:12.5px;opacity:.7;margin-top:2px}
.bub.B{align-self:flex-start;background:#dfe4fb;border-bottom-left-radius:5px}
.bub.C{align-self:flex-end;background:#e4f6c8;border-bottom-right-radius:5px}
.bub.now{outline:2.5px solid var(--accent)}
.bub.hidden-line{background:#fff;border:1.5px dashed var(--accent-2);color:var(--sub)}
.who{font-size:11px;font-weight:800;letter-spacing:.3px;opacity:.55;display:block;margin-bottom:1px}
/* cup */
.cup{width:118px;flex:none}
.cupwrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cupcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:center;cursor:pointer}
.cupcard .read{font-size:13px;margin-top:6px;min-height:36px}
.codetable{width:100%;border-collapse:collapse;font-size:14.5px}
.codetable td{padding:7px 6px;border-top:1px solid var(--line)}
.codetable td.c{font-family:var(--hand);font-size:18px;font-weight:700;color:var(--accent);white-space:nowrap;width:90px}
.choices{display:grid;gap:8px}
.choice{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 13px;cursor:pointer;font-size:15px}
.choice.right{border-color:var(--ok);background:var(--ok-bg)}
.choice.wrong{border-color:var(--ng);background:var(--ng-bg)}
/* money */
.drawer{background:#1e1b19;border-radius:14px;padding:10px;display:grid;gap:8px;user-select:none}
.drow{display:grid;gap:6px}
.slot{background:#2c2825;border:1.5px solid #3e3934;border-radius:8px;min-height:62px;display:flex;align-items:center;justify-content:center;color:#d9cfc4;font-weight:800;font-size:17px;cursor:pointer;position:relative;text-align:center;padding:4px}
.slot.note{min-height:84px}
.slot.hl{outline:3px solid #ffcf5a;outline-offset:-1px}
.slot.right{background:#24563b;border-color:#3d8d63}
.slot.wrong{background:#6b2a24;border-color:#a8473e}
.slot .q{color:#7c7168;font-size:22px}
.coinbar{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.money-btn{border:0;background:transparent;padding:2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--sub);font-weight:700}
.given{display:flex;flex-wrap:wrap;gap:6px;min-height:56px;align-items:center;padding:8px;border:1.5px dashed var(--line);border-radius:12px;background:#fff}
.given .money-btn{font-size:10px}
.big-num{font-size:30px;font-weight:800;letter-spacing:-.5px}
/* files */
.file{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid var(--line);cursor:pointer}
.file:first-child{border-top:0}
.file .ic{width:42px;height:42px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none;font-size:12px;font-weight:800;color:var(--accent);overflow:hidden}
.file .ic img{width:100%;height:100%;object-fit:cover}
.modal{position:fixed;inset:0;background:rgba(20,15,10,.92);z-index:50;display:flex;flex-direction:column}
.modal .mbar{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;color:#fff}
.modal .mbar .t{flex:1;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modal .mbody{flex:1;overflow:auto;padding:0 8px 30px;-webkit-overflow-scrolling:touch}
.modal .mbody img{display:block;width:100%;max-width:1100px;margin:0 auto 10px;border-radius:6px;background:#fff}
.modal .mbody iframe{width:100%;height:100%;border:0;background:#fff;border-radius:6px}
.modal .btn{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
.sheet{position:fixed;inset:0;background:rgba(20,15,10,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.home-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-decoration:none;color:inherit;box-shadow:var(--shadow);display:block}
.home-card b{display:block;font-size:15.5px;margin-bottom:2px}
.home-card .muted{font-size:12.5px}
.home-card .pct{margin-top:10px}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 2px;border-top:1px solid var(--line);cursor:pointer}
.check:first-child{border-top:0}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.check.done span{color:var(--sub);text-decoration:line-through}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.hint{font-family:ui-monospace,Menlo,monospace;letter-spacing:.5px;color:var(--accent);font-size:15px}
.dk-wrap{display:flex;justify-content:center;margin-bottom:12px}
.docket{background:#fff;width:100%;max-width:300px;padding:16px 18px 12px;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:14.5px;color:#222;box-shadow:0 2px 10px rgba(0,0,0,.12);border-radius:3px;
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat, radial-gradient(circle 5px at 50% 100%, transparent 98%, #000) bottom/12px 8px repeat-x;
  mask:linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat, radial-gradient(circle 5px at 50% 100%, transparent 98%, #000) bottom/12px 8px repeat-x}
.dk-big{font-size:30px;font-weight:800;line-height:1.1}
.dk-app{font-size:17px;font-weight:800;letter-spacing:.5px}
.dk-inv{display:inline-block;background:#111;color:#fff;font-weight:800;font-size:20px;padding:2px 10px;margin:4px 0}
.dk-name{font-size:18px;font-weight:700}
.dk-sm{font-size:12px;color:#555}
.dk-rule{border-top:1px dashed #999;border-bottom:1px dashed #999;text-align:center;font-weight:700;margin:8px 0;padding:3px 0;letter-spacing:1px}
.dk-body{padding:4px 0 10px}
.dk-item{font-weight:700;margin-top:8px}
.dk-mod{padding-left:28px;color:#333}
.dk-foot{border-top:1px dashed #999;font-size:11px;color:#777;padding-top:6px;margin-top:6px}
.dk-q{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.empty{text-align:center;color:var(--sub);padding:28px 8px}
</style>
</head>
<body>
<header>
  <div class="hbar">
    <h1>☕ 바리스타 잡 <span>준비</span></h1>
    <button class="btn ghost sm" id="btnSettings" aria-label="설정">⚙︎ 음성</button>
  </div>
  <nav id="nav">
    <a href="#home">홈</a>
    <a href="#interview">면접</a>
    <a href="#phrases">매장 영어</a>
    <a href="#dialog">대화 롤플레이</a>
    <a href="#names">이름</a>
    <a href="#cup">컵 마킹</a>
    <a href="#money">돈</a>
    <a href="#files">자료실</a>
  </nav>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
try { if ("serviceWorker" in navigator && location.protocol === "https:" && window.top === window.self) navigator.serviceWorker.register("sw.js"); } catch(e){}
</script>
</body>
</html>
